# Responde solo a los comentarios nuevos del canal con Gemini, plan gratuito (sin Claude Code).
# Requiere los secrets YOUTUBE_TOKEN_JSON y GEMINI_API_KEY (gratis en aistudio.google.com).
name: Responder comentarios

# El cron de GitHub no se disparaba en este repo (24-25/09/2026): si sigue sin
# hacerlo, crear un job en cron-job.org que llame a workflow_dispatch como los demás.
# Aquí no importa que se solape con cron-job.org: solo responde a lo que siga pendiente.
on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Ensayo: muestra las respuestas SIN publicarlas"
        type: boolean
        default: false
      probar_modelo:
        description: "Solo comprobar que la IA responde (comentario inventado)"
        type: boolean
        default: false

concurrency:
  group: comentarios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  responder:
    runs-on: ubuntu-24.04  # fijado: ubuntu-latest pasa a 26 el 19/10/2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Responder
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_EN_JSON: ${{ secrets.YOUTUBE_TOKEN_EN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q google-api-python-client google-auth requests
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          python scripts/responder_auto.py ${{ inputs.prueba && '--prueba' || '' }} ${{ inputs.probar_modelo && '--probar-modelo' || '' }}
          # Canal en inglés (Wild Facts Daily).
          if [ -n "$YOUTUBE_TOKEN_EN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_EN_JSON" > token_en.json
            YOUTUBE_TOKEN_FILE=token_en.json CANAL_NOMBRE="Wild Facts Daily" COMENTARIOS_IGNORADOS=comentarios_ignorados_en.txt               python scripts/responder_auto.py ${{ inputs.prueba && '--prueba' || '' }} || echo "::warning::respuestas EN fallaron"
          fi
          rm -f token.json token_en.json

      - name: Guardar comentarios ignorados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          touch comentarios_ignorados.txt
          git add comentarios_ignorados.txt $( [ -f comentarios_ignorados_en.txt ] && echo comentarios_ignorados_en.txt )
          git commit -m "Comentarios ignorados $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
