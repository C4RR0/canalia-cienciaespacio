name: Probar analytics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          pip install -q google-api-python-client google-auth
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          python scripts/probar_analytics.py
          rm -f token.json
