# Publica 1 vídeo de la cola en YouTube por ejecución, SIN depender de Claude.
# Sustituye a la rutina cloud de Claude (que se paraba al agotarse los créditos).
# Requiere el secret YOUTUBE_TOKEN_JSON (contenido de token.json del canal).
#
# Cuota YouTube compartida por los 3 canales (mismo proyecto Google Cloud,
# ~6 subidas/día, reinicio 07:00 UTC en verano / 08:00 UTC desde el 1/11): Sabías Qué 5/día
# (prioridad), CiberJuegos 1. Mitos en pausa. Primera a las 07:20 UTC = 9:20 en España,
# justo tras el reinicio. OJO: desde el 1/11 el reinicio pasa a 08:00 UTC -> mover a 8,11,14,17,20.
name: Publicar siguiente video

# Lo dispara cron-job.org (job "Publicar Sabías Qué", 9:20/12:20/15:20/18:20/21:20
# hora de Madrid) vía API workflow_dispatch. NO usar `schedule`: el cron de GitHub
# no llegó a dispararse nunca (24-25/09/2026) y además duplicaría subidas.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Ensayo: renderiza el siguiente video SIN subirlo"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04  # fijado: ubuntu-latest pasa a 26 el 19/10/2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar cola (rapido, sin instalar nada)
        id: cola
        run: |
          python scripts/publicar_siguiente.py --listar | tee cola.txt
          if grep -q "Nada pendiente" cola.txt; then echo "hay=0" >> "$GITHUB_OUTPUT"; else echo "hay=1" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar ffmpeg y dependencias
        if: steps.cola.outputs.hay == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation
          pip install -q -r requirements.txt

      - name: Producir y publicar
        if: steps.cola.outputs.hay == '1'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          python scripts/publicar_siguiente.py ${{ inputs.prueba && '--prueba' || '' }} | tee salida.txt
          rm -f token.json

      - name: Subir video de prueba como artefacto
        if: inputs.prueba
        uses: actions/upload-artifact@v4
        with:
          name: video-prueba
          path: salidas/*_FINAL.mp4

      - name: Commit de limpieza de cola
        if: steps.cola.outputs.hay == '1' && !inputs.prueba
        run: |
          rm -f token.json
          ID=$(grep -oP "PUBLICADO=\K.*" salida.txt || true)
          [ -z "$ID" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add -A cola_audio cola_imagenes cola_subtitulos cola_miniaturas $( [ -d cola_clips_ia ] && echo cola_clips_ia )
          git commit -m "Limpieza cola tras completar $ID (GitHub Actions)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
