# Publica 1 vídeo de la cola en YouTube por ejecución, SIN depender de Claude.
# Sustituye a la rutina cloud de Claude (que se paraba al agotarse los créditos).
# Requiere el secret YOUTUBE_TOKEN_JSON (contenido de token.json del canal).
#
# Cuota YouTube compartida por los 3 canales (mismo proyecto Google Cloud,
# ~6 subidas/día, reinicio 07:00 UTC en verano / 08:00 UTC desde el 1/11): Sabías Qué 5/día
# (prioridad), CiberJuegos 1. Mitos en pausa. Primera a las 07:20 UTC = 9:20 en España,
# justo tras el reinicio. OJO: desde el 1/11 el reinicio pasa a 08:00 UTC -> mover a 8,11,14,17,20.
name: Publicar siguiente video

# Lo dispara cron-job.org (job "Publicar Sabías Qué", 7:20/9:20/12:20/15:20/18:20/
# 21:20/23:20 hora de Madrid, 7 al día desde el 14/10) vía API workflow_dispatch.
# El schedule de GitHub NO es fiable (24-25/09 no saltó; 15/10 se saltó las 05:20
# UTC y la de 21:20 llegó 2,5 h tarde): no volver a usarlo para publicar.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Ensayo: renderiza el siguiente video SIN subirlo"
        type: boolean
        default: false
      prueba_ingles:
        description: "Ensayo de la versión en inglés del siguiente vídeo (sin subir)"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04  # fijado: ubuntu-latest pasa a 26 el 19/10/2026
    # 75: el 26/10 apt tardó 39 min y el timeout de 45 cortó el commit de limpieza
    # (el vídeo se publicó dos veces). publicar_siguiente.py ya comprueba duplicados.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar cola (rapido, sin instalar nada)
        id: cola
        run: |
          python scripts/publicar_siguiente.py --listar | tee cola.txt
          if grep -q "Nada pendiente" cola.txt; then echo "hay=0" >> "$GITHUB_OUTPUT"; else echo "hay=1" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar ffmpeg y dependencias
        if: steps.cola.outputs.hay == '1'
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg fonts-dejavu fonts-liberation
          pip install -q -r requirements.txt

      - name: Producir y publicar
        if: steps.cola.outputs.hay == '1'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_EN_JSON: ${{ secrets.YOUTUBE_TOKEN_EN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          # Canal en inglés (opcional): sin el secret no se crea el fichero y no se hace nada.
          [ -n "$YOUTUBE_TOKEN_EN_JSON" ] && printf '%s' "$YOUTUBE_TOKEN_EN_JSON" > token_en.json
          if [ "${{ inputs.prueba_ingles }}" = "true" ]; then
            ID=$(python -c "import sys; sys.path.insert(0, 'scripts'); import publicar_siguiente as p; print(p.ids_listos()[0])")
            python scripts/publicar_ingles.py "$ID" --prueba | tee salida.txt
          else
            python scripts/publicar_siguiente.py ${{ inputs.prueba && '--prueba' || '' }} | tee salida.txt
          fi
          rm -f token.json token_en.json

      - name: Subir video de prueba como artefacto
        if: inputs.prueba || inputs.prueba_ingles
        uses: actions/upload-artifact@v4
        with:
          name: video-prueba
          path: salidas/*_FINAL.mp4

      - name: Commit de limpieza de cola
        if: steps.cola.outputs.hay == '1' && !inputs.prueba && !inputs.prueba_ingles
        run: |
          rm -f token.json token_en.json
          ID=$(grep -oP "PUBLICADO=\K.*" salida.txt || true)
          [ -z "$ID" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add -A cola_audio cola_imagenes cola_subtitulos cola_miniaturas $( [ -d cola_clips_ia ] && echo cola_clips_ia )
          git commit -m "Limpieza cola tras completar $ID (GitHub Actions)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
