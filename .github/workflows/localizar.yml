# Traduce títulos y descripciones al inglés y portugués (scripts/localizar.py).
# Lo dispara cron-job.org (job "Localizar títulos Sabías Qué", 9:40 de Madrid, después del
# reinicio de la cuota de YouTube): el cron de GitHub no saltó el 16/10/2026.
name: Localizar títulos

on:
  workflow_dispatch:
    inputs:
      maximo:
        description: "Máximo de vídeos"
        type: string
        default: "40"

permissions:
  contents: read

jobs:
  localizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Localizar
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q google-api-python-client google-auth requests pillow
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          python scripts/localizar.py "${{ inputs.maximo || '40' }}"
          rm -f token.json
