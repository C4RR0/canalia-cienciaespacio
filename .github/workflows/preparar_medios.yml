# Genera voz, imágenes, subtítulos y miniatura de los ids listados en
# pendientes_medios.txt (uno por línea) y los sube al repo para la revisión visual
# en local. Cada id que sale bien se quita de la lista.
# Creado el 12/10/2026 cuando edge-tts daba 403 en local (luego resultó ser un cambio
# de endpoint, ver generar_audio.py); se mantiene para generar sin el PC.
name: Preparar medios

on:
  push:
    branches: [main]
    paths:
      - "pendientes_medios.txt"
  workflow_dispatch:

concurrency:
  group: preparar-medios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-24.04  # fijado: ubuntu-latest pasa a 26 el 19/10/2026
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation
          pip install -q -r requirements.txt

      - name: Generar medios
        run: |
          for id in $(grep -v '^#' pendientes_medios.txt); do
            echo "::group::$id"
            if REUTILIZAR_MEDIOS=1 python scripts/generar_audio_pipeline.py "produccion_config/$id.json"; then
              sed -i "/^$id\$/d" pendientes_medios.txt
              echo "$id" >> pendientes_qa.txt
            else
              echo "FALLO $id"
            fi
            echo "::endgroup::"
            sleep 60  # Commons da 429 si se encadenan descargas
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          touch pendientes_qa.txt
          git add cola_audio cola_imagenes cola_subtitulos cola_miniaturas pendientes_medios.txt pendientes_qa.txt
          git commit -m "Medios generados en GitHub Actions" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      # La QA de imágenes NO va aquí: la lanza "QA de imágenes" al acabar este
      # workflow (workflow_run). Junta, podía pasar del límite de tiempo y
      # perderse también los medios generados (13/10/2026).

      # Que el run salga en ROJO (y GitHub mande correo) si algo no se generó.
      # Antes salía en verde aunque fallaran todos (12/10/2026).
      - name: Comprobar que no queda nada pendiente
        run: |
          pend=$(grep -v '^#' pendientes_medios.txt | grep -c . || true)
          echo "Sin generar: $pend"
          [ "$pend" = 0 ]
